[project]
name = "mkespn-k810-keyboard"
version = "0.1.0"
description = "Independent HID configurator for the MKESPN K810 keypad"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["hidapi>=0.15.0,<0.16"]

[dependency-groups]
research = ["pefile==2024.8.26", "capstone>=5,<6", "unicorn>=2.1,<3"]

[project.scripts]
mkespn-k810-keyboard = "mkespn_k810_keyboard:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
